<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مين أنت في التخصص؟ | GDGoC DevFest</title>
  <meta name="description" content="لعبة أسئلة سريعة لفعالية DevFest من GDGoC: اكتب تخصصك وجاوب على 5 أسئلة.">
  <meta name="theme-color" content="#4285F4">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- شريط التقدم بألوان جوجل -->
  <div class="top-progress is-brand" id="topProgress" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-text" dir="ltr"><b>GDGoC</b> <span id="eventName">DevFest</span></span>
    </div>
    <div class="top-actions">
      <button class="icon-btn lang-btn" id="langBtn" type="button"><span id="langBtnText">EN</span></button>
      <button class="icon-btn mute-btn" id="muteBtn" type="button" aria-pressed="false">
        <svg class="ic-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ic-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <!-- 1) شاشة البداية -->
    <section class="screen" id="screenStart" aria-labelledby="heroTitle">
      <div class="card hero-card">
        <div class="shapes" aria-hidden="true"><i class="sh sh-b"></i><i class="sh sh-r"></i><i class="sh sh-y"></i><i class="sh sh-g"></i></div>
        <span class="kicker" data-i18n="kicker"></span>
        <h1 id="heroTitle" class="hero-title" data-i18n="heroTitle"></h1>
        <p class="hero-sub" id="heroSub"></p>

        <form id="majorForm" class="major-form" autocomplete="off" novalidate>
          <label for="majorInput" class="form-label" data-i18n="askMajor"></label>
          <div class="input-row">
            <input id="majorInput" class="major-input" type="text" maxlength="60" enterkeyhint="go" dir="auto" spellcheck="false" autocapitalize="off">
            <button class="btn btn-primary btn-start" type="submit">
              <span data-i18n="start"></span>
              <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <p class="form-error" id="formError" role="alert"></p>
        </form>

        <p class="meta" id="startMeta"></p>

        <details class="all-majors">
          <summary data-i18n="browse"></summary>
          <div class="majors-grid" id="majorsGridStart"></div>
        </details>
      </div>
    </section>

    <!-- 2) شاشة الاقتراحات -->
    <section class="screen" id="screenSuggest" hidden aria-labelledby="suggestTitle">
      <div class="card suggest-card">
        <div class="big-emoji" aria-hidden="true">🤔</div>
        <h2 id="suggestTitle" class="suggest-title" dir="auto"></h2>
        <p class="suggest-sub" data-i18n="suggestSub"></p>
        <div class="suggest-list" id="suggestList"></div>
        <div class="row-actions">
          <button class="btn btn-tonal" id="btnGeneral" type="button"></button>
          <button class="btn btn-text" id="btnBackSuggest" type="button" data-i18n="back"></button>
        </div>
        <details class="all-majors">
          <summary data-i18n="showAll"></summary>
          <div class="majors-grid" id="majorsGridSuggest"></div>
        </details>
      </div>
    </section>

    <!-- 3) شاشة الأسئلة -->
    <section class="screen" id="screenQuiz" hidden>
      <div class="quiz-head">
        <div class="quiz-info">
          <span class="major-chip" id="quizMajor"></span>
          <span class="counter" id="qCounter"></span>
        </div>
        <div class="quiz-side">
          <span class="score-pill" id="scorePill"></span>
          <div class="timer" id="timer" role="timer" data-level="ok">
            <svg viewBox="0 0 60 60" aria-hidden="true">
              <circle class="timer-track" cx="30" cy="30" r="26"></circle>
              <circle class="timer-ring" id="timerRing" cx="30" cy="30" r="26"></circle>
            </svg>
            <span class="timer-num" id="timerNum">20</span>
          </div>
        </div>
      </div>

      <p class="notice" id="quizNotice" hidden></p>

      <div class="card q-card" id="qCard">
        <h2 class="q-text" id="qText" dir="auto"></h2>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback" hidden>
          <div class="fb-title" id="fbTitle"></div>
          <p class="fb-answer" id="fbAnswer" dir="auto"></p>
          <p class="fb-explain" id="fbExplain" dir="auto"></p>
          <div class="fb-actions">
            <button class="btn btn-primary btn-next" id="btnNext" type="button">
              <span class="btn-label"></span>
              <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="quiz-foot">
        <button class="btn btn-text btn-small" id="btnQuit" type="button"></button>
        <p class="keys-hint" data-i18n="keysHint"></p>
      </div>
    </section>

    <!-- 4) شاشة النتيجة -->
    <section class="screen" id="screenResult" hidden aria-labelledby="tierTitle">
      <div class="card result-card">
        <p class="result-major" id="resultMajor"></p>
        <div class="score-wrap">
          <svg class="score-ring" id="scoreRing" viewBox="0 0 120 120" aria-hidden="true"></svg>
          <div class="score-center">
            <span class="score-num" id="scoreNum">0</span>
            <span class="score-of" id="scoreOf"></span>
          </div>
        </div>
        <div class="tier-emoji" id="tierEmoji" aria-hidden="true"></div>
        <h2 class="tier-title" id="tierTitle"></h2>
        <p class="tier-msg" id="tierMsg"></p>
        <div class="row-actions">
          <button class="btn btn-primary" id="btnPlayAgain" type="button">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="btn-label"></span>
          </button>
          <button class="btn btn-outline" id="btnChangeMajor" type="button">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h13l-3-3M20 17H7l3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="btn-label"></span>
          </button>
        </div>
        <details class="review">
          <summary data-i18n="review"></summary>
          <ol class="review-list" id="reviewList"></ol>
        </details>
      </div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="sr-only" id="srLive" aria-live="polite"></div>

  <script src="questions.js"></script>
  <script src="sounds.js"></script>
  <script src="game.js"></script>
</body>
</html>
